name: Build webOS IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install webOS CLI
        run: npm install -g @webosbrew/ares-cli

      - name: Package IPK
        run: |
          mkdir build
          cp appinfo.json index.html icon.png build/
          ares-package build/

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: "*.ipk"
          
